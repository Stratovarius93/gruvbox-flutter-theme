# Gruvbox Flutter Theme for Warp — same palette as the VS Code / Neovim theme.
# Bright colors use classic Gruvbox so bold/bright text stands out.
name: Gruvbox Flutter
accent: '#fe8019'
cursor: '#fe8019'
background: '#282828'
foreground: '#ebdbb2'
details: darker
terminal_colors:
  normal:
    black: '#3c3836'
    red: '#ea6962'
    green: '#a9b665'
    yellow: '#d8a657'
    blue: '#7daea3'
    magenta: '#d3869b'
    cyan: '#89b482'
    white: '#d4be98'
  bright:
    black: '#928374'
    red: '#fb4934'
    green: '#b8bb26'
    yellow: '#fabd2f'
